<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .canvas{width:1200px;height:630px;background:linear-gradient(135deg,#6366f1 0%,#4338ca 100%);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  /* 카운트가 쌓이는 것을 옅은 막대로 암시한다. 글자는 넣지 않는다. */
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:40px;padding:0 60px 0}
  .bars i{flex:1;background:rgba(255,255,255,.06);border-radius:8px 8px 0 0}
  .mark{position:relative;width:340px;height:340px}
  .mark svg{width:100%;height:100%}
</style>
<div class="canvas">
  <div class="bars">
    <i style="height:22%"></i><i style="height:38%"></i><i style="height:30%"></i>
    <i style="height:55%"></i><i style="height:44%"></i><i style="height:68%"></i>
  </div>
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <path d="M16 27V12" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M16 14.5c0-4.1-3-7.4-6.8-7.4C9.2 11.6 12.1 14.5 16 14.5z" fill="#34d399"/>
      <path d="M16 16.8c0-4.1 3-7.4 6.8-7.4C22.8 13.9 19.9 16.8 16 16.8z" fill="#6ee7b7"/>
    </svg>
  </div>
</div>
